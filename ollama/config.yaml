name: "Ollama"
version: "0.2.1"
slug: "ollama"
description: "Run Ollama locally on Home Assistant"
arch:
  - aarch64
  - amd64
init: false
ports:
  11434/tcp: 11434
backup_exclude:
  - "ollama/models/*"
  - "ollama/dist/*"
options:
  models_to_pull: []
  auto_update: true
  ollama_version: "latest"
schema:
  models_to_pull:
    - str
  auto_update: bool
  ollama_version: str
